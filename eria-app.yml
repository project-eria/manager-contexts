# ERIA package description (orchestrator catalog, eria-manager DESIGN §12.3)
name: manager-contexts
title: Contextes
description: Contextes globaux de la maison (présence, week-end, vacances...), avec état persistant
kind: manager
requires: [storage]

exec:
  args: ["--config-path", "{config}"]
  env: ["ERIA_DATA_PATH={data}/data.json"]
  health: { url: "http://127.0.0.1:{port}/eria", grace: 20s, interval: 10s }

config: |
  host: 0.0.0.0
  port: 20000
  location: Europe/Paris
  # Contexts people choose, in display order, with their names
  # contexts:
  #   - { id: away, name: Absents }
